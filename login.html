<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Login</h1>
    <form name="frm_login" id="frm_login" method="post" action="https://mail.google.com/">
        <p>Ingresa tu correo</p>
        <input type="email" name="txt-user" id="txt-user" maxlength="20">
        <p>Ingresa tu contraseña</p>
        <input type="password" name="txt-pass" id="txt-pass" maxlength="20">
        <br>
        <button name="btn-enviar" id="btn-enviar" value="enviar">Enviar Datos</button>
    </form>
</body>
